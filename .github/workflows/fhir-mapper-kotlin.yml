name: fhir-mapper (Kotlin)

on:
  push:
    paths:
      - "services/fhir-mapper-kotlin/**"
      - ".github/workflows/fhir-mapper-kotlin.yml"
  pull_request:
    paths:
      - "services/fhir-mapper-kotlin/**"
      - ".github/workflows/fhir-mapper-kotlin.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fhir-mapper-kotlin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # No Gradle wrapper is committed, so CI provisions Gradle itself. The action also handles
      # the dependency cache, which is the slow part of a cold Kotlin build.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Build and test
        run: gradle --no-daemon build

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fhir-mapper-test-results
          path: services/fhir-mapper-kotlin/build/reports/tests/test
          if-no-files-found: ignore
