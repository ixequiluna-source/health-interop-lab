# nginx configuration for the console container.
#
# Runs entirely as an unprivileged user: no `user` directive (which requires root to honour),
# a listen port above 1024, and every path nginx writes to relocated under /tmp. The stock
# nginx image assumes a root master process that drops privileges for workers; this one never
# has privileges to drop.

pid /tmp/nginx.pid;
worker_processes auto;

error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Every writable path moved out of /var, so the whole filesystem can be mounted read-only
  # apart from an explicit /tmp. A container that cannot be made read-only is a container
  # where an RCE gets to persist.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # No request logging, deliberately.
  #
  # This console's URLs contain an MRN on the patient record route, and an access log is not
  # part of the clinical store's retention, access-control or audit regime. Logging every
  # request would put patient identifiers into a file with a different lifecycle and a
  # different set of readers — which is the gap HIPAA's minimum-necessary rule and SOC 2
  # CC6.1 are about. Request-level observability comes from the `traceparent` the console
  # attaches, which the backend records inside the audited boundary.
  access_log off;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers.
    #
    # The CSP has no 'unsafe-inline' for scripts: an Angular application bundle needs none,
    # and adding it to silence one console warning removes most of what a CSP is for.
    # 'unsafe-inline' *is* present for styles, because Angular writes component styles into
    # the document at runtime; the nonce-based alternative requires per-request HTML
    # rewriting, which a static file server cannot do.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # PHI is not cacheable by anything shared. `private` keeps it out of any intermediary,
    # and `no-store` keeps it off disk — including the browser's back/forward cache, which
    # is where a logged-out session's last patient record otherwise stays visible.
    add_header Cache-Control "no-store" always;

    # Hashed build artefacts are content-addressed, so they are immutable by construction and
    # the rule above does not apply to them.
    location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Liveness for the HEALTHCHECK. Served by nginx itself so it reports on the web server,
    # not on the backend — a console that is serving files correctly while the gateway is
    # down is not a container the orchestrator should restart.
    location = /healthz {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    # The Connect proxy, same-origin.
    #
    # Same-origin is what removes the CORS preflight — and with it the failure mode where a
    # missing `traceparent` in `Access-Control-Allow-Headers` makes every request fail as an
    # unexplained network error. `CONNECT_PROXY_URL` is substituted at container start, so
    # one image runs in every environment rather than one image per environment.
    location /interop.v1. {
      proxy_pass ${CONNECT_PROXY_URL};
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Forwarded explicitly. Without this the trace the console started is dropped at the
      # first hop and the backend spans have no parent to attach to.
      proxy_set_header traceparent $http_traceparent;
      proxy_read_timeout 30s;
    }

    location /ops/ {
      proxy_pass ${CONNECT_PROXY_URL};
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header traceparent $http_traceparent;
      proxy_read_timeout 10s;
    }

    # SPA fallback. Every unmatched path returns index.html so a deep link to
    # /patients/MRN-88213 works on a cold load rather than 404ing at the web server.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
