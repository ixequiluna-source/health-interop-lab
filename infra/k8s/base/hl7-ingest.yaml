# MLLP listener; parses HL7 v2 ADT and publishes canonical admission events.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hl7-ingest
  labels:
    app.kubernetes.io/name: hl7-ingest
    app.kubernetes.io/part-of: health-interop-lab
    data-class: phi
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: hl7-ingest
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the desired count during a rollout: a clinical feed that briefly
      # has zero listeners makes senders queue and, past their own timeout, drop messages.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hl7-ingest
        app.kubernetes.io/part-of: health-interop-lab
        data-class: phi
    spec:
      serviceAccountName: interop-workload
      # No pod in this namespace calls the Kubernetes API. Mounting the token anyway hands
      # every container a credential it does not need, which is the first thing picked up
      # by anything that achieves code execution inside the pod.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across nodes so a single node failure cannot take the service down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hl7-ingest
      containers:
        - name: hl7-ingest
          image: us-central1-docker.pkg.dev/REPLACE_PROJECT/interop-images/hl7-ingest:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: mllp
              containerPort: 2575
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            # Requests and limits are both set. A pod with no limit can starve its
            # neighbours; a pod with no request gets BestEffort QoS and is the first thing
            # evicted under memory pressure — which for the ingest listener means dropping
            # a live clinical feed.
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: KAFKA_TOPIC
              value: "clinical.admissions.v1"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "otel-collector:4317"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            # JVM services need a generous startup budget. Without a startupProbe the
            # liveness probe kills a slow-but-healthy start and the pod crash-loops forever.
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # The root filesystem is read-only, so anything that needs scratch space gets an
        # explicit, size-bounded emptyDir rather than a writable image.
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hl7-ingest
  labels:
    app.kubernetes.io/name: hl7-ingest
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hl7-ingest
  ports:
    - name: mllp
      port: 2575
      protocol: TCP
    - name: http
      port: 8080
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hl7-ingest
spec:
  # Voluntary disruptions (node drains, cluster upgrades) may never take the service to zero.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hl7-ingest
