name: claims-edi-dotnet

on:
  push:
    paths:
      - 'services/claims-edi-dotnet/**'
      - '.github/workflows/claims-edi-dotnet.yml'
  pull_request:
    paths:
      - 'services/claims-edi-dotnet/**'
      - '.github/workflows/claims-edi-dotnet.yml'

defaults:
  run:
    working-directory: services/claims-edi-dotnet

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ClaimsEdi.sln

      - name: Build
        run: dotnet build ClaimsEdi.sln -c Release --no-restore

      - name: Test
        run: dotnet test ClaimsEdi.sln -c Release --no-build --verbosity normal
