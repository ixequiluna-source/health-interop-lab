name: patient-gateway (Go)

on:
  push:
    paths:
      - "services/patient-gateway-go/**"
      - "proto/**"
      - ".github/workflows/patient-gateway-go.yml"
  pull_request:
    paths:
      - "services/patient-gateway-go/**"
      - "proto/**"
      - ".github/workflows/patient-gateway-go.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/patient-gateway-go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/patient-gateway-go/go.mod
          cache-dependency-path: services/patient-gateway-go/go.sum

      - uses: arduino/setup-protoc@v3
        with:
          version: "28.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Generated code is produced here rather than committed. The trade-off is deliberate:
      # committing it makes the diff readable, generating it makes it impossible for the
      # checked-in stubs to drift from the .proto they claim to describe.
      - name: Install protobuf plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

      - name: Generate protobuf stubs
        run: make proto

      # Resolve only committed versions and verify their recorded checksums.
      - name: Resolve dependencies
        run: go mod download
      - name: Verify dependency checksums
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # No -coverprofile: writing one invokes the `covdata` tool, which is absent from the
      # runner's toolchain and fails every package before a single test runs. -race is the
      # part that earns its keep here anyway.
      - name: Test
        run: go test -race ./...
